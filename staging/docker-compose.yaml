services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: core.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
  clc-core:
    image: ghcr.io/cosmo-local-credit/clc-core:pr-15
    restart: unless-stopped
    env_file: core.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - caddy
    labels:
      caddy: staging.cosmolocal.credit
      caddy.reverse_proxy: "{{upstreams 5003}}"
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy
    depends_on:
      - clc-core

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --interval 120 --label-enable --cleanup --rolling-restart
    environment:
      WATCHTOWER_REGISTRY_AUTH: "true"
      DOCKER_API_VERSION: "1.41"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/sohail/.docker/config.json:/config.json:ro

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
  caddy:

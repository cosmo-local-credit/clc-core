name: lint

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Pinned to what go.mod declares rather than tracking stable: Go 1.27
          # ships a generic method in math/rand/v2 that golangci-lint v2.12 cannot
          # typecheck, so `stable` broke every push the day 1.27 was promoted.
          go-version: 1.26.x

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

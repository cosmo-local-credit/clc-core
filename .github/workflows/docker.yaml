name: release

# Branch builds run on develop and master only. Version tags still publish a release image.
on:
  push:
    branches:
      - develop
      - master
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Watchtower deploys each :develop image to staging. Core applies migrations
  # at startup and exits if one fails, so never publish an image whose
  # migrations the staging PostgreSQL image cannot apply.
  migrations:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clc_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # A skipped test must fail this gate as loudly as a failed one.
      - name: apply migrations to a fresh database
        env:
          CORE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/clc_core
        run: |
          set -euo pipefail
          go test ./migrations/ -count=1 -json -timeout 300s | tee /tmp/migration-tests.jsonl
          jq -e -s '
            any(.[]; .Action == "pass" and .Test == "TestMigrationsApplyToFreshDatabaseDB") and
            any(.[]; .Action == "pass" and .Test == "TestMigrationsUseDeployedExtensions") and
            all(.[]; .Action != "skip" and .Action != "fail")
          ' /tmp/migration-tests.jsonl

  docker:
    needs: migrations
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GHCR Docker registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set outputs
        run: echo "RELEASE_SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD=${{ env.RELEASE_SHORT_COMMIT }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          tags: ${{ steps.meta.outputs.tags }}

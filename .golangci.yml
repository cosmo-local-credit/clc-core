version: "2"

linters:
  default: none
  enable:
    # Declaration / structure ordering.
    - grouper
    - decorder
    # Correctness & dead code.
    - govet
    - errcheck
    - ineffassign
    - wastedassign
    - unused
    - staticcheck
    # Error-handling hygiene. The codebase wraps errors with %w at appropriate
    # boundaries and exposes sentinels via errors.Is/errors.As; these guard
    # that convention against regressions.
    - errorlint
    - errname
    - forcetypeassert
    # Modern Go hygiene (module is go 1.26).
    - copyloopvar
    - fatcontext
    - predeclared
    # Logging style for log/slog (Client stores a *slog.Logger).
    - sloglint
    # Structural cleanliness.
    - embeddedstructfieldcheck
    - dupl
    - iface
    - modernize
    # Extra bug/idiom catches not covered by govet/staticcheck.
    - gocritic
    # Documentation practice (basic rules only).
    - godoclint
  settings:
    grouper:
      const-require-single-const: true
      const-require-grouping: true
      import-require-single-import: true
      import-require-grouping: true
      type-require-single-type: true
      type-require-grouping: true
      var-require-single-var: true
      var-require-grouping: true
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
    errcheck:
      # Flag unchecked type assertions (e.g. x.(T) without comma-ok).
      check-type-assertions: true
      # Errors deliberately discarded for idiomatic CLI output and deferred
      # connection cleanup. pgx Conn.Close takes a context, so it does not
      # satisfy io.Closer and must be listed explicitly.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Conn).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        # Rollback errors are safe to ignore: the standard deferred-rollback
        # idiom drops the error (nil on success, ErrTxClosed if already committed).
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # BatchResults.Close errors are dropped after iterating SendBatch results.
        - (github.com/jackc/pgx/v5.BatchResults).Close
    godoclint:
      default: basic

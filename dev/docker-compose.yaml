  custodial-pg-store:
    image: postgres:18-alpine
    restart: unless-stopped
    user: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CUSTODIAL_PG_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  custodial-river-ui:
    image: ghcr.io/riverqueue/riverui:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:postgres@custodial-pg-store:5432/clc_core
    ports:
      - "127.0.0.1:${CUSTODIAL_RIVER_UI_HOST_PORT:-18080}:8080"
    depends_on:
      custodial-pg-store:
        condition: service_healthy  

volumes:
  pg-data:
    name: ${CUSTODIAL_PG_VOLUME_NAME:-clc-core-dev-pg}
    driver: local
  devnet-chaindata:
    driver: local